[package]
name = "quic-reality"
version = "0.5.0"
edition = "2021"
description = "QUIC + REALITY-style stealth proxy (authenticate inside QUIC Initial, transparent decoy fallback)"

[dependencies]
anyhow = "1"
blake2 = "0.10"
bytes = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "bloom"] }
quinn-proto = { version = "0.11", default-features = false }
rand = "0.8"
rcgen = "0.13"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[profile.release]
lto = true
codegen-units = 1
strip = true